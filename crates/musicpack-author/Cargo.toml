[package]
name = "musicpack-author"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Rust authoring pipeline: draft JSON -> encode -> waveform -> .mpack -> .mpak (R4.2)"
license = "BSD-3-Clause"
repository = "https://github.com/whepper/musicpack-core"
readme = "README.md"
publish = false

# Licensing note: this crate is original orchestration (no source-derived
# encoder logic). It depends on the isolated LGPL-2.1-or-later
# `musicpack-musepack-encoder` crate; the encoder's own terms apply to that
# component and its isolation is preserved (docs/adr/0011-authoring-pipeline.md).
[dependencies]
musicpack-core = { path = "../.." }
musicpack-musepack-encoder = { path = "../musicpack-musepack-encoder" }
# Discogs-EffNet producer (SimilarityProducer): exact runtime versions from
# the validated experiment. All four are permissive (MIT/Apache-2.0, MIT)
# pure-Rust crates: no Essentia, no FFmpeg, no C dependencies, no build
# scripts, no model code of their own.
microfft = { version = "=0.6.0", default-features = false, features = ["size-512"] }
# Optional and default-off: rten declares rust-version 1.94 while this
# crate (and the workspace) stays at MSRV 1.85 (G-5 PASS WITH SCOPED
# EXCEPTION). A disabled optional dependency never enters the build graph,
# so default builds keep the 1.85 promise; enabling `discogs-effnet`
# requires Rust 1.94 and fails loudly otherwise. See src/similarity_effnet.rs.
rten = { version = "=0.26.0", optional = true }
rubato = { version = "=0.16.2", default-features = false, features = ["fft_resampler"] }

[features]
# Discogs-EffNet inference runtime. Default-off; the only feature in this
# crate, so nothing enables it accidentally. Enabling compiles rten
# (effective MSRV 1.94) and the `EffNetProducer` inference path; profile
# metadata, DSP, writer, and cache behavior stay available without it.
discogs-effnet = ["dep:rten"]

[[bin]]
name = "musicpack-author"
path = "src/main.rs"

[lib]
name = "musicpack_author"
path = "src/lib.rs"
