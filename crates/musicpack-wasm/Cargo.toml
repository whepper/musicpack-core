[package]
name = "musicpack-wasm"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Thin wasm-bindgen binding foundation over musicpack-core and musicpack-engine"
license = "BSD-3-Clause"
repository = "https://github.com/whepper/musicpack-core"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
musicpack-core = { path = "../.." }
musicpack-engine = { path = "../musicpack-engine" }
wasm-bindgen = "0.2"
js-sys = "0.3"
