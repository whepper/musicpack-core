# R4.3: the application package is renamed so it can depend on the
# `musicpack-author` pipeline crate (which owns that package name). The
# library target (`musicpack_author_lib`) and the binary target
# (`musicpack-author`) are unchanged, so the Tauri bundle identity,
# entrypoints and tooling are unaffected.
[package]
name = "musicpack-author-app"
version = "0.1.0"
description = "MusicPack Author — the desktop GUI for authoring .mpack releases"
authors = ["The MusicPack Development Team"]
license = "BSD-3-Clause"
edition = "2021"
rust-version = "1.85"

[lib]
name = "musicpack_author_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "musicpack-author"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
ureq = "2"
sha2 = "0.10"
hex = "0.4"
libc = "0.2"
# Track-linked lyrics authoring (R3.5) is implemented against the
# authoritative package/manifest/lyrics primitives — never reimplemented
# in the host (author/AGENTS.md: package semantics stay in the CLI
# sidecar and, from R4, the Rust CLI / musicpack-core).
musicpack-core = { path = "../.." }
# R4.3: the Rust authoring pipeline is the default Author runtime. The
# dependency is renamed because this application package is itself named
# `musicpack-author`; the pipeline crate keeps its own name.
musicpack-author-pipeline = { package = "musicpack-author", path = "../../crates/musicpack-author" }

[features]
# This feature is used for production builds where a bundler is expected to
# ship a browser. Its absence means `tauri dev` uses the dev server URL.
custom-protocol = ["tauri/custom-protocol"]

[dev-dependencies]
tempfile = "3"

# `tauri dev` otherwise runs the whole authoring DSP chain (native FLAC/WAV
# decode, waveform accumulation, BS.1770 loudness) at opt-level 0, which makes
# the waveform stage ~26x slower than the release build for no debugging
# benefit: the hot code is dependency-internal and has no debug info worth
# stepping through. The host itself stays unoptimized so incremental rebuilds
# remain fast. See the DSP profile note in `author/README.md`.
[profile.dev.package.musicpack-core]
opt-level = 2

[profile.dev.package.claxon]
opt-level = 3

# The Musepack encoder belongs to the same chain and is by far its most
# arithmetic-dense crate (the psychoacoustic model alone is ~72% of an
# encode). Left at the dev default it builds at opt-level 0, which made a
# 10-track album take ~250 s of encoding instead of ~10 s. Opt-level cannot
# move a single output bit: Rust emits no FP contraction and no fast-math, so
# float evaluation order is independent of codegen level (stream SHA-256 is
# identical at opt-level 0, 2 and 3).
[profile.dev.package.musicpack-musepack-encoder]
opt-level = 3

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
strip = true
