[package]
name = "music-similarity-eval"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
description = "Isolated MusicPack Discogs-EffNet similarity evaluation spike"
license = "BSD-3-Clause"
publish = false
default-run = "music-similarity-eval"

[dependencies]
musicpack-core = { path = "../.." }
microfft = { version = "=0.6.0", default-features = false, features = ["size-512"] }
rten = "=0.26.0"
rubato = { version = "=0.16.2", default-features = false, features = ["fft_resampler"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

# Keep this package out of the production workspace. It has an independent
# lockfile and is intentionally not a member of ../Cargo.toml.
[workspace]
