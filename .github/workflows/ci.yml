name: CI

on:
  push:
    branches: [main]
  pull_request:

# Default read-only GitHub token for every job; the `changes` job adds the
# `pull-requests: read` it needs to run the path filter on PRs.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Path router: keep expensive Rust jobs off frontend-only changes and
  # vice versa. Fallback intent: when in doubt, the job runs.
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      web: ${{ steps.filter.outputs.web }}
      author: ${{ steps.filter.outputs.author }}
      similarity: ${{ steps.filter.outputs.similarity }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rust:
              - 'crates/**'
              - 'src/**'
              - 'tests/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'fuzz/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/rust.yml'
            web:
              - 'web/**'
              - '.github/workflows/web.yml'
            author:
              - 'author/**'
              - '.github/workflows/author.yml'
            # The isolated similarity experiment is its own workspace and is
            # deliberately excluded from the `rust` filter above, so an
            # experiment-only change does not trigger the production build.
            # Note the consequence: a change to `src/**` that broke the
            # experiment's dependency on musicpack-core would not run this job.
            # Widening the filter to include `src/**` is a one-line change if
            # that is preferred over the narrower, cheaper job.
            similarity:
              - 'experiments/music-similarity-eval/**'
              - '.github/workflows/similarity.yml'

  test:
    name: build & test (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Format
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all --check
      - name: Clippy
        if: matrix.os == 'ubuntu-latest'
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Build
        run: cargo build --workspace --all-targets --verbose
      - name: Test
        run: cargo test --workspace --verbose

  wasm:
    name: wasm32 core check
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      # The core must stay WebAssembly-clean; the CLI is a native consumer.
      - name: Check (wasm32-unknown-unknown)
        run: cargo check -p musicpack-core --target wasm32-unknown-unknown
      - name: Clippy (wasm32-unknown-unknown)
        run: cargo clippy -p musicpack-core --target wasm32-unknown-unknown -- -D warnings

  fuzz-targets:
    name: fuzz targets compile
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # libFuzzer *linking* needs nightly; type-checking the target bodies
      # keeps them from rotting without making fuzzing part of CI.
      - name: Check fuzz targets
        run: cargo check --manifest-path fuzz/Cargo.toml

  msrv:
    name: MSRV 1.85 (default features)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The declared workspace MSRV, tested rather than merely declared.
      # Nothing here enables optional, higher-MSRV features (notably not
      # musicpack-author/discogs-effnet, which needs Rust 1.94 via rten):
      # a lockfile-wide audit shows rten/rten-simd are the only packages
      # above 1.85. No fmt/clippy here — their output is toolchain-version
      # sensitive and belongs to the stable job.
      - uses: dtolnay/rust-toolchain@1.85
      - name: Check default workspace
        run: cargo check --workspace --all-targets
      - name: Test author (default)
        run: cargo test -p musicpack-author
      - name: Test server (default)
        run: cargo test -p musicpack-server

  discogs-effnet:
    name: Discogs-EffNet feature (stable, no model)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # Live-model tests skip without operator-supplied artifacts
      # (MUSICPACK_TEST_EFFNET_MULTI/RELEASE); the rest proves the
      # feature-gated code compiles, lints, and behaves.
      - name: Clippy with feature
        run: cargo clippy -p musicpack-author --all-targets --features discogs-effnet -- -D warnings
      - name: Test author with feature
        run: cargo test -p musicpack-author --features discogs-effnet --test effnet
      - name: Test server with feature
        run: cargo test -p musicpack-server --features discogs-effnet --test similarity_server

  web:
    name: web player
    needs: changes
    if: needs.changes.outputs.web == 'true'
    uses: ./.github/workflows/web.yml

  author:
    name: author
    needs: changes
    if: needs.changes.outputs.author == 'true'
    uses: ./.github/workflows/author.yml

  similarity:
    name: similarity format
    needs: changes
    if: needs.changes.outputs.similarity == 'true'
    uses: ./.github/workflows/similarity.yml
