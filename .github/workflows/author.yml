name: Author CI

on:
  workflow_call:

permissions:
  contents: read

jobs:
  author-app:
    name: author app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: author/package-lock.json
      - name: Install dependencies
        working-directory: author
        run: npm ci
      - name: Type-check
        working-directory: author
        run: npm run check
      - name: Unit and component tests
        working-directory: author
        run: npm test
      - name: Build web bundle
        working-directory: author
        run: npm run build:web

  # Type-check the Tauri host (not a bundle build — the desktop packaging
  # step is developer/release work, not CI). The sidecar binaries are
  # gitignored; zero-byte placeholders satisfy the config path check.
  author-native:
    name: author tauri host
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri system dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: author/src-tauri
      - name: Check (author/src-tauri)
        working-directory: author/src-tauri
        run: cargo check --all-targets
