<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MusicPack</title>
  <meta name="description" content="Your digital record shelf — browse, choose an edition, and play your collection.">
  <!-- Strict CSP: no unsafe-eval/unsafe-inline scripts beyond the WASM
       decoder; inline style attributes are allowed (UI layout literals).
       Workers + the AudioWorklet module come from self. -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self';
                 script-src 'self' 'wasm-unsafe-eval';
                 worker-src 'self';
                 connect-src 'self';
                 img-src 'self' data:;
                 style-src 'self' 'unsafe-inline';
                 font-src 'self';
                 media-src 'self' blob:;
                 object-src 'none';
                 base-uri 'none';
                 form-action 'none'">
  <meta name="theme-color" content="#0f1013">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/png" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
